# Nextcloud para la gestión documental (punto 12).
# Stack independiente del de la aplicación: tiene su propia base de datos y su propia red.
# Uso: copiar .env.example a .env, completar las contraseñas y ejecutar:
#   docker compose up -d
name: nextcloud-hoteles

services:
  nc-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?Definir NC_DB_PASSWORD en el archivo .env}
    volumes:
      - nc-db-data:/var/lib/postgresql/data
    networks:
      - red-nextcloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    # Versión fija de la rama estable; actualizar a un parche 33.0.x más nuevo cuando corresponda.
    image: nextcloud:33.0.5-apache
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      nc-db:
        condition: service_healthy
    ports:
      # Solo accesible desde la propia máquina. Para publicarlo, hacerlo a través del túnel con control de acceso.
      - "127.0.0.1:${NC_PORT:-8085}:80"
    environment:
      POSTGRES_HOST: nc-db
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?Definir NC_DB_PASSWORD en el archivo .env}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:?Definir NC_ADMIN_USER en el archivo .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?Definir NC_ADMIN_PASSWORD en el archivo .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_TRUSTED_DOMAINS:-localhost}
    volumes:
      - nc-html:/var/www/html
    networks:
      - red-nextcloud

volumes:
  nc-db-data:
  nc-html:

networks:
  red-nextcloud:
    driver: bridge
