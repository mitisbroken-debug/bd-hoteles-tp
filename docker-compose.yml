services:
  db-hoteles:
    image: postgres:16
    container_name: db-hoteles
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5440:5432"
    volumes:
      - hoteles-data:/var/lib/postgresql/data
      - ./sql/esquema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  hoteles-data: