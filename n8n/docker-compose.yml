# Punto 13 - Automatización de procesos con n8n
#
# Parte del compose que genera el instalador oficial de n8n (get.n8n.io, el de la guía
# de la cátedra). De ese compose se dejó solo lo que usan los flujos:
#   - n8n          : el editor y el motor de los flujos
#   - n8n-runners  : ejecuta el código de los nodos Code, separado de n8n
# Se sacaron el "sandbox" (un contenedor con privilegios totales sobre Docker) y el
# buscador searxng: los 3 flujos no los usan y son más superficie de ataque y más carga.
# Se agregó:
#   - db-verificacion : PostgreSQL chico y aislado. Guarda las tablas de control de los
#                       flujos y es donde se restaura el backup para comprobarlo.
#
# Levantar (parados en esta carpeta, con el .env ya creado por preparar.ps1):
#   docker compose up -d
#
# Las claves NO van acá: se leen de .env (que no se sube a GitHub).

name: n8n-hoteles

services:

  # ---------- n8n ----------
  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION:-2.45.7}
    container_name: n8n-hoteles
    restart: unless-stopped
    depends_on:
      db-verificacion:
        condition: service_healthy
    ports:
      # Solo en 127.0.0.1: el editor no se ve desde otras máquinas de la red.
      # Alertmanager llega igual, porque usa host.docker.internal.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      # Hora de Jujuy para los disparadores por horario y para los registros.
      GENERIC_TIMEZONE: America/Argentina/Jujuy
      TZ: America/Argentina/Jujuy
      # Dirección con la que n8n arma los enlaces (por ejemplo, los de Aprobar / Rechazar).
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      # Ejecutor de código externo (igual que en el compose oficial).
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Falta N8N_RUNNERS_AUTH_TOKEN. Ejecutar preparar.ps1}
      # Registro de ejecuciones: se guardan todas (bien y mal) durante 14 días.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      # No mandar datos de uso a n8n.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Los flujos leen de acá la configuración que NO es secreta (direcciones, nombres).
      # Las claves van en las credenciales de n8n, cifradas, nunca en estas variables.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://host.docker.internal:9090}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-}
      MAIL_DESTINO: ${MAIL_DESTINO:-}
      MANTIS_URL: ${MANTIS_URL:-}
      MANTIS_PROYECTO: ${MANTIS_PROYECTO:-}
      MANTIS_CATEGORIA: ${MANTIS_CATEGORIA:-Infraestructura}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USUARIO: ${NEXTCLOUD_USUARIO:-}
      NEXTCLOUD_CARPETA: ${NEXTCLOUD_CARPETA:-08_Automatizacion_n8n}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.1-flash-lite}
      BACKUP_MAX_HORAS: ${BACKUP_MAX_HORAS:-26}
      BACKUP_MIN_BYTES: ${BACKUP_MIN_BYTES:-1024}
    volumes:
      # Persistencia: flujos, credenciales cifradas, clave de cifrado e historial.
      - n8n-data:/home/node/.n8n
      # Los flujos exportados, para importarlos con importar.ps1.
      - ./flujos:/flujos:ro
    # En Docker Desktop host.docker.internal ya existe; en Linux hace falta esta línea.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - n8n

  # ---------- Ejecutor de los nodos Code ----------
  n8n-runners:
    image: ghcr.io/n8n-io/runners:${N8N_VERSION:-2.45.7}
    container_name: n8n-runners
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Falta N8N_RUNNERS_AUTH_TOKEN. Ejecutar preparar.ps1}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      GENERIC_TIMEZONE: America/Argentina/Jujuy
      TZ: America/Argentina/Jujuy
    networks:
      - n8n

  # ---------- Base de control y de restauración de prueba ----------
  db-verificacion:
    image: postgres:16
    container_name: n8n-db-verificacion
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${VERIF_ADMIN_PASSWORD:?Falta VERIF_ADMIN_PASSWORD. Ejecutar preparar.ps1}
      POSTGRES_DB: automatizacion
      # Clave del usuario limitado que usa n8n (la lee db/inicio.sql al crear la base).
      N8N_DB_PASSWORD: ${VERIF_N8N_PASSWORD:?Falta VERIF_N8N_PASSWORD. Ejecutar preparar.ps1}
      TZ: America/Argentina/Jujuy
      PGTZ: America/Argentina/Jujuy
    volumes:
      - verificacion-data:/var/lib/postgresql/data
      - ./db/inicio.sql:/docker-entrypoint-initdb.d/01_inicio.sql:ro
      # Los backups que genera db-backup, en SOLO LECTURA: desde acá no se pueden borrar ni pisar.
      - ${BACKUPS_DIR:-../backups}:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automatizacion"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Sin "ports": esta base no se publica. Solo n8n llega a ella, por la red interna.
    networks:
      - n8n

  # ---------- Carga de credenciales (se ejecuta una vez, con importar.ps1) ----------
  # Lee las claves del .env y las guarda cifradas dentro de n8n. No queda corriendo.
  n8n-credenciales:
    image: docker.io/n8nio/n8n:${N8N_VERSION:-2.45.7}
    profiles: ["herramientas"]
    env_file: .env
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
    entrypoint: ["node", "/herramientas/credenciales.js"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./herramientas:/herramientas:ro
    networks:
      - n8n

networks:
  n8n:
    name: n8n_red

volumes:
  n8n-data:
  verificacion-data:
