name: CI/CD Hotel System Pipeline

on:
  push:
    branches: [ "feature/front-docker-cicd", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y verificar Backend
        run: |
          docker build -t fiore2028/hotel-backend:latest ./backend

      - name: Construir y verificar Frontend
        run: |
          docker build -t fiore2028/hotel-frontend:latest ./frontend

      - name: Push de imágenes a Docker Hub (Solo si pasa las validaciones)
        if: github.event_name != 'pull_request'
        run: |
          docker push fiore2028/hotel-backend:latest
          docker push fiore2028/hotel-frontend:latest