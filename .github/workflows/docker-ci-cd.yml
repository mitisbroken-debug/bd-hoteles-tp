name: CI/CD Hotel System Pipeline

on:
  push:
    branches: [ "feature/front-docker-cicd", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar dependencias, sintaxis y seguridad del Backend
        run: |
          cd backend
          npm ci
          node --check src/server.js
          npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y etiquetar Backend
        run: |
          docker build -t fiore2028/hotel-backend:latest ./backend
          docker tag fiore2028/hotel-backend:latest fiore2028/hotel-backend:${{ github.sha }}

      - name: Construir y etiquetar Frontend
        run: |
          docker build -t fiore2028/hotel-frontend:latest ./frontend
          docker tag fiore2028/hotel-frontend:latest fiore2028/hotel-frontend:${{ github.sha }}

      - name: Push de imágenes a Docker Hub (Solo si pasa las validaciones)
        if: github.event_name != 'pull_request'
        run: |
          docker push fiore2028/hotel-backend:latest
          docker push fiore2028/hotel-backend:${{ github.sha }}
          docker push fiore2028/hotel-frontend:latest
          docker push fiore2028/hotel-frontend:${{ github.sha }}